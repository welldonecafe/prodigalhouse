    <style>
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

        /* Custom Range Input (Audio timeline) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #000;
            cursor: pointer;
            margin-top: -4px;
        }
        .dark input[type=range]::-webkit-slider-thumb { background: #fff; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #374151; }
        input[type=range]:focus { outline: none; }
        
        /* Smooth Accordion */
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }
        .accordion-content.expanded { grid-template-rows: 1fr; }
        .accordion-inner { overflow: hidden; }
    </style>

    <main class="flex-grow max-w-4xl mx-auto w-full p-4 mt-6">

                </div>

            </div>

            <div class="border border-gray-200 dark:border-gray-800 rounded-lg p-6 md:p-8 bg-gray-50/50 dark:bg-[#111]/60 backdrop-blur-sm">

                        <!-- Sender Name -->

                        </div>

                        <!-- Sender Email -->
                        <div>
                            <label for="senderEmail" class="block text-xs font-mono text-gray-600 dark:text-gray-400 mb-2">Email Address *</label>
                            <input type="email" id="senderEmail" name="email" required placeholder="name@domain.com" class="w-full bg-white dark:bg-[#161616] border border-gray-200 dark:border-gray-800 rounded px-3.5 py-2.5 text-sm font-sans focus:border-black dark:focus:border-white focus:outline-none transition-colors">
                        </div>
                    </div>

                    <!-- Subject Line -->

                    </div>

                    <!-- Message -->

                        <label for="messageBody" class="block text-xs font-mono text-gray-600 dark:text-gray-400 mb-2">Message *</label>
                        <textarea id="messageBody" name="message" rows="5" required placeholder="Type your message here..." class="w-full bg-white dark:bg-[#161616] border border-gray-200 dark:border-gray-800 rounded p-3 text-sm font-sans focus:border-black dark:focus:border-white focus:outline-none transition-colors leading-relaxed"></textarea>
                    </div>

                    <!-- Security Verification / CAPTCHA -->
                    <div class="p-4 border border-gray-200 dark:border-gray-800 rounded-md bg-white dark:bg-[#161616]">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                                <label for="captchaInput" class="block text-xs font-mono text-gray-700 dark:text-gray-300 font-medium mb-1">Human Verification *</label>

                            </div>

                                    <canvas id="captchaCanvas" width="130" height="38" class="block"></canvas>
                                </div>
                                <button type="button" id="reloadCaptcha" class="p-2 border border-gray-200 dark:border-gray-700 rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 hover:text-black dark:hover:text-white transition-colors" title="Generate new code" aria-label="Refresh Captcha">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                    </svg>

                            </div>
                        </div>

                        <div class="mt-3">

                        </div>

                    { title: "Chapter 5", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/08 - Jason Deramo - Chapter 5.mp3" },
                    { title: "Chapter 6", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/09 - Jason Deramo - Chapter 6.mp3" },
                    { title: "Chapter 7", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/10 - Jason Deramo - Chapter 7.mp3" },
                    { title: "Chapter 8", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/11 - Jason Deramo - Chapter 8.mp3" },
                    { title: "Chapter 9", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/12 - Jason Deramo - Chapter 9.mp3" },
                    { title: "Chapter 10", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/13 - Jason Deramo - Chapter 10.mp3" },
                    { title: "Chapter 11", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/14 - Jason Deramo - Chapter 11.mp3" },
                    { title: "Chapter 12", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/15 - Jason Deramo - Chapter 12.mp3" },
                    { title: "Chapter 13", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/16 - Jason Deramo - Chapter 13.mp3" },
                    { title: "Chapter 14", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/17 - Jason Deramo - Chapter 14.mp3" },
                    { title: "Chapter 15", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/18 - Jason Deramo - Chapter 15.mp3" },
                    { title: "Chapter 16", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/19 - Jason Deramo - Chapter 16.mp3" },
                    { title: "Chapter 17", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/20 - Jason Deramo - Chapter 17.mp3" },
                    { title: "Resources", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/21 - Jason Deramo - Resources.mp3" },
                    { title: "About", duration: "--:--", audioUrl: "audio/shells-of-infinity/audio/22 - Jason Deramo - About.mp3" }
                ]
            }
        ];

        // ----------------------------------------------------
        // AUDIOBOOK RENDERING & ACCORDION
        // ----------------------------------------------------
        const listContainer = document.getElementById('audiobook-list');
        let activeBookId = null;
        let activeChapterIndex = null;
        const globalAudio = new Audio();

        function renderAudiobooks() {
            audiobooks.forEach((book, index) => {
                const isLast = index === audiobooks.length - 1;
                
                let chaptersHtml = book.chapters.map((chapter, idx) => `
                    <div id="chap-row-${book.id}-${idx}" class="flex items-center justify-between p-3 text-sm border-b last:border-b-0 border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-[#1a1a1a] transition-colors cursor-pointer group" onclick="playChapter(event, '${book.id}', ${idx})">
                        <div class="flex items-center gap-3">
                            <svg class="w-4 h-4 text-gray-400 group-hover:text-black dark:group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                            <span id="chap-title-${book.id}-${idx}" class="font-mono text-gray-700 dark:text-gray-300 transition-colors">${idx + 1}. ${chapter.title}</span>
                        </div>
                        <span id="chap-dur-${book.id}-${idx}" class="font-mono text-xs text-gray-500">${chapter.duration}</span>
                    </div>
                `).join('');

                let pdfButtonHtml = '';
                if (book.pdfUrl) {
                    pdfButtonHtml = `
                        <div class="flex justify-end mt-3 w-32 md:w-full">
                            <a href="${book.pdfUrl}" target="_blank" download class="inline-flex items-center gap-2 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-[#1a1a1a] text-xs font-mono px-3 py-1.5 rounded transition-colors text-gray-700 dark:text-gray-300" onclick="event.stopPropagation()">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Download PDF
                            </a>
                        </div>
                    `;
                }

                const html = `
                    <div class="repo-item flex justify-between items-center p-3 cursor-pointer hover:bg-gray-100 dark:hover:bg-[#1a1a1a] transition-colors ${!isLast ? 'border-b border-gray-200 dark:border-gray-800' : ''}" onclick="toggleAccordion('${book.id}')">
                        <div class="flex items-center gap-3 font-mono text-sm">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                            <span class="font-medium text-gray-900 dark:text-gray-200">${book.title.replace(/\s+/g, '-').toLowerCase()}/</span>
                        </div>
                        <span class="font-mono text-xs text-gray-500">${book.duration}</span>
                    </div>

                    <div id="content-${book.id}" class="accordion-content bg-white dark:bg-[#0a0a0a] ${!isLast ? 'border-b border-gray-200 dark:border-gray-800' : ''}">
                        <div class="accordion-inner">
                            <div class="p-6 flex flex-col md:flex-row gap-8">
                                
                                <div class="w-full md:w-1/3 flex flex-col gap-4">
                                    <div>
                                        <div class="w-32 h-32 md:w-full md:h-auto md:aspect-square flex-shrink-0 relative group">
                                            <img src="${book.coverUrl}" alt="Cover art for ${book.title}" class="w-full h-full object-cover rounded shadow-sm transition-all duration-500 group-hover:brightness-110 group-hover:shadow-md">
                                            <div class="absolute inset-0 border border-black/10 dark:border-white/10 rounded pointer-events-none"></div>
                                        </div>
                                        ${pdfButtonHtml}
                                    </div>
                                    <div class="flex flex-col">
                                        <h2 class="text-xl font-semibold mb-1">${book.title}</h2>
                                        <p class="text-xs font-mono text-gray-500 mb-3">By ${book.author}</p>
                                        <p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-4">${book.synopsis}</p>
                                    </div>
                                </div>
                                
                                <div class="w-full md:w-2/3 flex flex-col gap-4">
                                    <div class="border border-gray-200 dark:border-gray-800 rounded-md bg-white dark:bg-[#0a0a0a] overflow-y-auto max-h-[300px]">
                                        ${chaptersHtml}
                                    </div>
                                    
                                    <div class="mt-6 bg-gray-50 dark:bg-[#111] p-3 rounded-md border border-gray-200 dark:border-gray-800">
                                        <div class="text-xs font-mono text-gray-500 mb-3 truncate px-1" id="now-playing-${book.id}">Select a chapter to play</div>
                                        <div class="flex items-center gap-4">
                                            <button id="playBtn-${book.id}" class="play-toggle p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition" onclick="toggleMainPlay(event, '${book.id}')" aria-label="Play/Pause">
                                                <svg class="play-icon w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                <svg class="pause-icon w-4 h-4 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                            </button>
                                            
                                            <div class="flex-grow flex items-center gap-3">
                                                <span id="currentTime-${book.id}" class="text-xs font-mono text-gray-500 w-10 text-right">0:00</span>
                                                <input type="range" id="seek-${book.id}" value="0" class="w-full" onchange="seekAudio(event, '${book.id}')" oninput="updateSeekUI(event, '${book.id}')" aria-label="Seek timeline">
                                                <span id="duration-${book.id}" class="text-xs font-mono text-gray-500 w-10">0:00</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', html);
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const isExpanded = content.classList.contains('expanded');
            
            document.querySelectorAll('.accordion-content').forEach(el => {
                el.classList.remove('expanded');
            });

            if (!isExpanded) {
                content.classList.add('expanded');
            }
        }

        // ----------------------------------------------------
        // AUDIO PLAYER ENGINE
        // ----------------------------------------------------
        function playChapter(event, bookId, chapterIndex) {
            event.stopPropagation();
            const book = audiobooks.find(b => b.id === bookId);
            const chapter = book.chapters[chapterIndex];

            if (activeBookId === bookId && activeChapterIndex === chapterIndex) {
                toggleMainPlay(event, bookId);
                return;
            }

            if (activeBookId && activeBookId !== bookId) {
                resetPlayerUI(activeBookId);
            }

            activeBookId = bookId;
            activeChapterIndex = chapterIndex;
            
            globalAudio.src = chapter.audioUrl;
            globalAudio.load();
            globalAudio.play().catch(() => {});

            updatePlayerUI(bookId, true);
        }

        function toggleMainPlay(event, bookId) {
            event.stopPropagation();
            if (activeBookId !== bookId) {
                playChapter(event, bookId, 0);
                return;
            }

            if (globalAudio.paused) {
                globalAudio.play().catch(() => {});
                updatePlayerUI(bookId, true);
            } else {
                globalAudio.pause();
                updatePlayerUI(bookId, false);
            }
        }

        function updatePlayerUI(bookId, isPlaying) {
            const playBtn = document.getElementById(`playBtn-${bookId}`);
            if (!playBtn) return;
            const playIcon = playBtn.querySelector('.play-icon');
            const pauseIcon = playBtn.querySelector('.pause-icon');
            const nowPlaying = document.getElementById(`now-playing-${bookId}`);

            const book = audiobooks.find(b => b.id === bookId);
            const chapter = book.chapters[activeChapterIndex || 0];
            
            if (nowPlaying) nowPlaying.textContent = `Playing: ${chapter.title}`;

            book.chapters.forEach((_, idx) => {
                const titleSpan = document.getElementById(`chap-title-${bookId}-${idx}`);
                if(titleSpan) titleSpan.classList.remove('text-black', 'dark:text-white', 'font-bold');
            });

            if (activeChapterIndex !== null) {
                const activeTitle = document.getElementById(`chap-title-${bookId}-${activeChapterIndex}`);
                if(activeTitle) activeTitle.classList.add('text-black', 'dark:text-white', 'font-bold');
            }

            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        function resetPlayerUI(id) {
            const btn = document.getElementById(`playBtn-${id}`);
            if(btn) {
                btn.querySelector('.play-icon').classList.remove('hidden');
                btn.querySelector('.pause-icon').classList.add('hidden');
            }
            const seek = document.getElementById(`seek-${id}`);
            if(seek) seek.value = 0;
            const current = document.getElementById(`currentTime-${id}`);
            if(current) current.textContent = "0:00";
            
            const nowPlaying = document.getElementById(`now-playing-${id}`);
            if(nowPlaying) nowPlaying.textContent = "Select a chapter to play";
            
            const book = audiobooks.find(b => b.id === id);
            if(book) {
                book.chapters.forEach((_, idx) => {
                    const titleSpan = document.getElementById(`chap-title-${id}-${idx}`);
                    if(titleSpan) titleSpan.classList.remove('text-black', 'dark:text-white', 'font-bold');
                });
            }
        }

        globalAudio.addEventListener('loadedmetadata', () => {
            if (!activeBookId) return;
            const durationEl = document.getElementById(`duration-${activeBookId}`);
            if (durationEl && globalAudio.duration && globalAudio.duration !== Infinity) {
                durationEl.textContent = formatTime(globalAudio.duration);
                const rowDur = document.getElementById(`chap-dur-${activeBookId}-${activeChapterIndex}`);
                if(rowDur) rowDur.textContent = formatTime(globalAudio.duration);
            }
        });

        globalAudio.addEventListener('timeupdate', () => {
            if (!activeBookId) return;
            const seekBar = document.getElementById(`seek-${activeBookId}`);
            const currentTimeDisplay = document.getElementById(`currentTime-${activeBookId}`);

            if (globalAudio.duration && globalAudio.duration !== Infinity) {
                const value = (100 / globalAudio.duration) * globalAudio.currentTime;
                seekBar.value = value;
                currentTimeDisplay.textContent = formatTime(globalAudio.currentTime);
            }
        });

        globalAudio.addEventListener('ended', () => {
            if (activeBookId && activeChapterIndex !== null) {
                const book = audiobooks.find(b => b.id === activeBookId);
                if (activeChapterIndex + 1 < book.chapters.length) {
                    playChapter({stopPropagation:()=>{}}, activeBookId, activeChapterIndex + 1);
                } else {
                    resetPlayerUI(activeBookId);
                    activeBookId = null;
                    activeChapterIndex = null;
                }
            }
        });

        window.seekAudio = function(event, bookId) {
            event.stopPropagation();
            if (activeBookId === bookId && globalAudio.duration) {
                const time = globalAudio.duration * (event.target.value / 100);
                globalAudio.currentTime = time;
            } else if (activeBookId !== bookId) {
                event.target.value = 0;
            }
        }

        window.updateSeekUI = function(event, bookId) {
            event.stopPropagation();
            if (activeBookId === bookId && globalAudio.duration) {
                const time = globalAudio.duration * (event.target.value / 100);
                document.getElementById(`currentTime-${bookId}`).textContent = formatTime(time);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // ----------------------------------------------------
        // THEME CONTROLLER
        // ----------------------------------------------------
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const htmlElement = document.documentElement;

        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                htmlElement.classList.add('dark');
                sunIcon.classList.remove('hidden');
            } else {
                htmlElement.classList.remove('dark');
                moonIcon.classList.remove('hidden');
            }
        } catch (e) {
            moonIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            
            if (isDark) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                try { localStorage.setItem('theme', 'dark'); } catch(e){}
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                try { localStorage.setItem('theme', 'light'); } catch(e){}
            }
            // Redraw captcha on theme toggle to maintain contrast
            generateCaptcha();
        });

        // ----------------------------------------------------
        // NAVIGATION / HOME LINK CONTROLLER
        // ----------------------------------------------------
        const homeLink = document.getElementById('homeLink');
        homeLink.addEventListener('click', (e) => {
            e.preventDefault();
            
            // Collapse all audiobook accordion menus
            document.querySelectorAll('.accordion-content').forEach(el => {
                el.classList.remove('expanded');
            });
            
            // Hide the contact section
            const contactSection = document.getElementById('contact');
            if(contactSection) {
                contactSection.classList.add('hidden');
            }
            
            // Smoothly scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ----------------------------------------------------
        // CONTACT FORM TOGGLE
        // ----------------------------------------------------
        const contactToggleBtn = document.getElementById('contactToggleBtn');
        const contactSection = document.getElementById('contact');

        contactToggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            contactSection.classList.toggle('hidden');
            if (!contactSection.classList.contains('hidden')) {
                // Calculate scroll position offset for the sticky header
                const headerOffset = 80;
                const elementPosition = contactSection.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.scrollY - headerOffset;
                
                window.scrollTo({
                    top: offsetPosition,
                    behavior: 'smooth'
                });
                
                // Auto-focus the first field without jumping the scroll
                setTimeout(() => document.getElementById('senderName').focus({ preventScroll: true }), 300);
            }
        });

        // ----------------------------------------------------
        // CAPTCHA GENERATION ENGINE
        // ----------------------------------------------------
        let currentCaptchaCode = "";
        const captchaCanvas = document.getElementById('captchaCanvas');
        const reloadCaptchaBtn = document.getElementById('reloadCaptcha');

        function generateCaptcha() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // clear of ambiguous 0/O, 1/I
            let code = "";
            for (let i = 0; i < 5; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptchaCode = code;

            const ctx = captchaCanvas.getContext('2d');
            const isDark = htmlElement.classList.contains('dark');

            // Clear background
            ctx.fillStyle = isDark ? '#141414' : '#f4f4f5';
            ctx.fillRect(0, 0, captchaCanvas.width, captchaCanvas.height);

            // Draw noise lines
            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.moveTo(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height);
                ctx.lineTo(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height);
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }

            // Draw random dots for noise
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.18)';
                ctx.beginPath();
                ctx.arc(Math.random() * captchaCanvas.width, Math.random() * captchaCanvas.height, 1, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw text with random rotation and jitter
            ctx.font = 'bold 22px "JetBrains Mono", monospace';
            ctx.textBaseline = 'middle';

            const startX = 14;
            for (let i = 0; i < code.length; i++) {
                ctx.save();
                const charX = startX + i * 22;
                const charY = captchaCanvas.height / 2 + (Math.random() * 4 - 2);
                const angle = (Math.random() - 0.5) * 0.35;

                ctx.translate(charX, charY);
                ctx.rotate(angle);
                ctx.fillStyle = isDark ? '#f3f4f6' : '#111827';
                ctx.fillText(code[i], 0, 0);
                ctx.restore();
            }
        }

        reloadCaptchaBtn.addEventListener('click', generateCaptcha);

        // ----------------------------------------------------
        // FORM SUBMISSION & ROUTING CONTROLLER
        // ----------------------------------------------------
        const submissionForm = document.getElementById('submissionForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const submitSpinner = document.getElementById('submitSpinner');
        const notification = document.getElementById('formNotification');

        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = "mt-6 p-4 rounded-md text-xs font-mono border transition-all";
            if (type === 'error') {
                notification.classList.add('bg-red-50', 'dark:bg-red-950/30', 'text-red-700', 'dark:text-red-400', 'border-red-200', 'dark:border-red-800');
            } else if (type === 'success') {
                notification.classList.add('bg-emerald-50', 'dark:bg-emerald-950/30', 'text-emerald-700', 'dark:text-emerald-400', 'border-emerald-200', 'dark:border-emerald-800');
            }
            notification.classList.remove('hidden');
            notification.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        submissionForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Check honeypot
            if (submissionForm._honey.value) {
                return; // Silently abort bot submissions
            }

            const name = document.getElementById('senderName').value.trim();
            const email = document.getElementById('senderEmail').value.trim();
            const subject = document.getElementById('submissionSubject').value.trim();
            const message = document.getElementById('messageBody').value.trim();
            const captchaInput = document.getElementById('captchaInput').value.trim();

            // Validate basic inputs
            if (!name || !email || !subject || !message) {
                showNotification('Please fill in all required fields.', 'error');
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                showNotification('Please provide a valid email address.', 'error');
                return;
            }

            // Verify Captcha
            if (captchaInput.toUpperCase() !== currentCaptchaCode) {
                showNotification('Incorrect code. Please type the characters shown in the image.', 'error');
                generateCaptcha();
                document.getElementById('captchaInput').value = "";
                return;
            }

            // Lock submit button
            submitBtn.disabled = true;
            submitBtnText.textContent = "Sending...";
            submitSpinner.classList.remove('hidden');
            notification.classList.add('hidden');

            // Build submission payload
            // Primary destination: prodigalhouse@proton.me
            // Discreet CC recipient: Jason.a.deramo@gmail.com (passed discreetly in backend form payload)
            const formData = new FormData();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('_replyto', email);
            formData.append('subject', subject);
            formData.append('message', message);
            
            // Backend CC routing
            formData.append('_cc', 'Jason.a.deramo@gmail.com');
            formData.append('_template', 'table');

            try {
                // Post to FormSubmit AJAX endpoint
                const response = await fetch('https://formsubmit.co/ajax/prodigalhouse@proton.me', {
                    method: 'POST',
                    headers: { 
                        'Accept': 'application/json'
                    },
                    body: formData
                });

                if (response.ok) {
                    showNotification('Your message was sent successfully. Thank you!', 'success');
                    submissionForm.reset();
                    generateCaptcha();
                } else {
                    const resJson = await response.json().catch(() => null);
                    const errorMsg = resJson && resJson.message ? resJson.message : 'There was an issue sending your message. Please try again.';
                    showNotification(errorMsg, 'error');
                }
            } catch (err) {
                // Graceful fallback display
                showNotification('Your message could not be sent. Please check your internet connection and try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtnText.textContent = "Send Message";
                submitSpinner.classList.add('hidden');
            }
        });

        // Initialize App & Captcha
        renderAudiobooks();
        generateCaptcha();
    </script>
</body>
